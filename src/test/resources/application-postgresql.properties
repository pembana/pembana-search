# Use a disposable database: Hibernate creates and drops the test schema.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/search_tests}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:search_tests}
spring.datasource.password=${POSTGRES_PASSWORD:search_tests}
spring.jpa.hibernate.ddl-auto=create-drop
