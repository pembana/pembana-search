name: Maven CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-artifact-id:
        type: string
      release-tag:
        type: string
      release-revision:
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    name: Runtime Java ${{ matrix.java }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        database: [h2, postgresql]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/checkout-release
        if: inputs.release-artifact-id != ''
        with:
          artifact-id: ${{ inputs.release-artifact-id }}
          tag: ${{ inputs.release-tag }}
          revision: ${{ inputs.release-revision }}

      - name: Set up runtime Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Remember the test runtime
        run: echo "TEST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up build Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Record build environment
        run: |
          mkdir -p build/compatibility
          git rev-parse HEAD | tee build/compatibility/revision.txt
          java -version 2>&1 | tee build/compatibility/environment.log
          ./mvnw --version 2>&1 | tee -a build/compatibility/environment.log
          "$TEST_JAVA_HOME/bin/java" -version 2>&1 | tee build/compatibility/runtime-environment.log

      - name: Run the full corpus and coverage checks
        run: |
          ./mvnw --batch-mode -Dgpg.skip=true -Djvm="$TEST_JAVA_HOME/bin/java" -Dspring.profiles.active=${{ matrix.database }} clean verify 2>&1 | tee build/compatibility/build.log

      - name: Verify core dependency boundary
        run: |
          test -s pembana-search-core/target/dependencies.txt
          if grep -Eq 'org.springframework|jakarta.persistence|org.hibernate|org.postgresql|com.h2database|org.jetbrains.kotlin' pembana-search-core/target/dependencies.txt; then
            echo "Core acquired a framework, persistence, database, or Kotlin dependency"
            exit 1
          fi

      - name: Verify packaged identity and attribution
        run: |
          set -- pembana-search-*/target/pembana-search-*.jar
          test "$#" -eq 10
          : > build/compatibility/runtime-classes.txt
          for archive in "$@"; do
            listing="build/compatibility/$(basename "$archive").contents.txt"
            jar tf "$archive" > "$listing"
            if grep -Eq '(^|/)com/sipios/|^SyntaxErrorListener.class$' "$listing"; then
              echo "Unexpected upstream package in $archive"
              exit 1
            fi
            for notice in LICENSE LICENSE.txt NOTICE; do
              unzip -p "$archive" "META-INF/$notice" | cmp - "$notice"
            done
            case "$archive" in
              *-sources.jar|*-javadoc.jar|*-tests.jar) ;;
              *) grep '\.class$' "$listing" >> build/compatibility/runtime-classes.txt ;;
            esac
          done
          sort build/compatibility/runtime-classes.txt | uniq -d > build/compatibility/duplicate-runtime-classes.txt
          test ! -s build/compatibility/duplicate-runtime-classes.txt
          for archive in pembana-search-core/target/*-sources.jar; do
            unzip -p "$archive" META-INF/grammar/Query.g4 | cmp - pembana-search-core/src/main/antlr4/Query.g4
          done

      - name: Record effective build configuration
        if: always()
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-help-plugin:3.2.0:effective-pom -Doutput=build/compatibility/effective-pom.xml 2>&1 | tee build/compatibility/effective-pom.log

      - name: Run the Java caller against the packaged JAR and selected database
        run: |
          artifact="$(find pembana-search-data-jpa/target -maxdepth 1 -name 'pembana-search-data-jpa-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-tests.jar')"
          test -f "$artifact"
          "$TEST_JAVA_HOME/bin/java" -Dspring.profiles.active=${{ matrix.database }} -cp "pembana-search-data-jpa/target/test-classes:${artifact}:$(cat pembana-search-data-jpa/target/java-caller-classpath.txt)" com.pembana.search.JavaCallerSmokeTest 2>&1 | tee build/compatibility/java-caller.log

      - name: Preserve compatibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-java${{ matrix.java }}-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/compatibility/
            pembana-search-*/target/surefire-reports/
            pembana-search-*/target/test-results/
            pembana-search-*/target/checkstyle-result.xml
            pembana-search-*/target/reports/apidocs/
            pembana-search-*/target/dependencies.txt
            pembana-search-data-jpa/target/java-caller-classpath.txt
          if-no-files-found: error
          retention-days: 30

  api-compatibility:
    name: Adopted source and binary API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/checkout-release
        if: inputs.release-artifact-id != ''
        with:
          artifact-id: ${{ inputs.release-artifact-id }}
          tag: ${{ inputs.release-tag }}
          revision: ${{ inputs.release-revision }}

      - name: Check out the adopted API baseline
        uses: actions/checkout@v5
        with:
          ref: e870eeb5f73e93ae5ec487787c879fd0d1e5232c
          path: build/api-compatibility/baseline

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package baseline and candidate without installing snapshots
        run: |
          set -o pipefail
          git rev-parse HEAD > build/api-compatibility/candidate-revision.txt
          git -C build/api-compatibility/baseline rev-parse HEAD > build/api-compatibility/baseline-revision.txt
          ./mvnw -B -ntp -Dgpg.skip=true -DskipTests package 2>&1 | tee build/api-compatibility/candidate-build.log
          (cd build/api-compatibility/baseline && ./mvnw -B -ntp -Dgpg.skip=true -DskipTests package) 2>&1 | tee build/api-compatibility/baseline-build.log

      - name: Compile unchanged source and execute unchanged baseline bytecode
        run: |
          set -o pipefail
          api_baseline="$GITHUB_WORKSPACE/build/api-compatibility/baseline"
          api_evidence="$GITHUB_WORKSPACE/build/api-compatibility"
          api_source="pembana-search-data-jpa/src/test/java/com/pembana/search/ApiCompatibilityTest.java"
          api_dependencies=$(tr ':' '\n' < pembana-search-data-jpa/target/java-caller-classpath.txt | grep -v '/com/pembana/' | paste -sd: -)
          api_baseline_cp="$api_baseline/pembana-search-core/target/pembana-search-core-1.0.0-SNAPSHOT.jar:$api_baseline/pembana-search-data-jpa/target/pembana-search-data-jpa-1.0.0-SNAPSHOT.jar:$api_dependencies"
          candidate_version=$(./mvnw -B -ntp -q -N help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)
          api_candidate_cp="$GITHUB_WORKSPACE/pembana-search-core/target/pembana-search-core-$candidate_version.jar:$GITHUB_WORKSPACE/pembana-search-data-jpa/target/pembana-search-data-jpa-$candidate_version.jar:$api_dependencies"
          mkdir -p "$api_evidence/baseline-classes" "$api_evidence/candidate-classes"
          javac --release 17 -proc:none -cp "$api_baseline_cp" -d "$api_evidence/baseline-classes" "$api_source" 2>&1 | tee "$api_evidence/baseline-compile.log"
          java -cp "$api_evidence/baseline-classes:$api_baseline_cp" com.pembana.search.ApiCompatibilityTest 2>&1 | tee "$api_evidence/baseline-run.log"
          java -cp "$api_evidence/baseline-classes:$api_candidate_cp" com.pembana.search.ApiCompatibilityTest 2>&1 | tee "$api_evidence/binary-run.log"
          javac --release 17 -proc:none -cp "$api_candidate_cp" -d "$api_evidence/candidate-classes" "$api_source" 2>&1 | tee "$api_evidence/source-compile.log"
          java -cp "$api_evidence/candidate-classes:$api_candidate_cp" com.pembana.search.ApiCompatibilityTest 2>&1 | tee "$api_evidence/source-run.log"

      - name: Preserve API compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/api-compatibility/*.log
            build/api-compatibility/*-revision.txt
            build/api-compatibility/*-classes/
          if-no-files-found: error
          retention-days: 30
