name: Compatibility baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline (${{ matrix.source }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: upstream
            revision: c4b404dc6cf22b540d3e7f6211e557f5d83b6c61
          - source: imported
            revision: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Record build environment
        run: |
          mkdir -p build/baseline
          git rev-parse HEAD | tee build/baseline/revision.txt
          java -version 2>&1 | tee build/baseline/environment.log
          ./mvnw --version 2>&1 | tee -a build/baseline/environment.log

      - name: Run original tests and coverage checks
        run: |
          ./mvnw --batch-mode -Dgpg.skip=true -Ddependency-check.skip=true clean verify 2>&1 | tee build/baseline/build.log

      - name: Record resolved dependencies
        if: always()
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.6.1:tree -Dverbose -DoutputFile=build/baseline/dependencies.txt 2>&1 | tee build/baseline/dependency-tree.log

      - name: Record effective build configuration
        if: always()
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-help-plugin:3.2.0:effective-pom -Doutput=build/baseline/effective-pom.xml 2>&1 | tee build/baseline/effective-pom.log

      - name: Run Java caller against the JAR without Kotlin dependencies
        if: matrix.source == 'imported'
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath -DincludeScope=test -DexcludeGroupIds=org.jetbrains.kotlin -DexcludeArtifactIds=jackson-module-kotlin -Dmdep.outputFile=build/baseline/java-caller-classpath.txt 2>&1 | tee build/baseline/classpath.log
          java -cp "target/test-classes:target/spring-search-0.3.0.jar:$(cat build/baseline/java-caller-classpath.txt)" com.sipios.springsearch.JavaCallerSmokeTest 2>&1 | tee build/baseline/java-caller-no-kotlin.log

      - name: Preserve baseline evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-baseline-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/baseline/
            target/surefire-reports/
            target/test-results/
          if-no-files-found: error
          retention-days: 30
