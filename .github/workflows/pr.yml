name: Compatibility baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Set up baseline evidence runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run pinned upstream and imported suites
        run: python3 scripts/compatibility-baseline.py

      - name: Check evidence integrity tooling
        if: always()
        run: python3 -m unittest discover -s scripts -p 'test_compatibility_baseline.py' -v

      - name: Preserve baseline evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/baseline/
          if-no-files-found: error
          retention-days: 30
