name: Framework and database compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Java ${{ matrix.java }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        database: [h2, postgresql]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Record build environment
        run: |
          mkdir -p build/compatibility
          git rev-parse HEAD | tee build/compatibility/revision.txt
          java -version 2>&1 | tee build/compatibility/environment.log
          ./mvnw --version 2>&1 | tee -a build/compatibility/environment.log

      - name: Run the full corpus and coverage checks
        run: |
          ./mvnw --batch-mode -Dgpg.skip=true -Ddependency-check.skip=true -Dspring.profiles.active=${{ matrix.database }} clean verify 2>&1 | tee build/compatibility/build.log

      - name: Record resolved dependencies
        if: always()
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.6.1:tree -Dverbose -DoutputFile=build/compatibility/dependencies.txt 2>&1 | tee build/compatibility/dependency-tree.log

      - name: Verify packaged identity and attribution
        run: |
          set -- target/pembana-search-*.jar
          test "$#" -eq 3
          for archive in "$@"; do
            listing="build/compatibility/$(basename "$archive").contents.txt"
            jar tf "$archive" > "$listing"
            if grep -Eq '(^|/)com/sipios/|^SyntaxErrorListener.class$' "$listing"; then
              echo "Unexpected upstream package in $archive"
              exit 1
            fi
            for notice in LICENSE LICENSE.txt NOTICE; do
              unzip -p "$archive" "META-INF/$notice" | cmp - "$notice"
            done
          done

      - name: Record effective build configuration
        if: always()
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-help-plugin:3.2.0:effective-pom -Doutput=build/compatibility/effective-pom.xml 2>&1 | tee build/compatibility/effective-pom.log

      - name: Run the Java caller against the packaged JAR and selected database
        run: |
          ./mvnw --batch-mode org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath -DincludeScope=test -Dmdep.outputFile=build/compatibility/java-caller-classpath.txt 2>&1 | tee build/compatibility/classpath.log
          artifact="$(find target -maxdepth 1 -name 'pembana-search-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')"
          test -f "$artifact"
          java -Dspring.profiles.active=${{ matrix.database }} -cp "target/test-classes:${artifact}:$(cat build/compatibility/java-caller-classpath.txt)" com.pembana.search.JavaCallerSmokeTest 2>&1 | tee build/compatibility/java-caller.log

      - name: Preserve compatibility evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-java${{ matrix.java }}-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/compatibility/
            target/surefire-reports/
            target/test-results/
            target/reports/apidocs/
          if-no-files-found: error
          retention-days: 30
